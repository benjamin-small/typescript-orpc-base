name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            client-side/pnpm-lock.yaml
            server-side/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: server-side
      - run: pnpm install --frozen-lockfile
        working-directory: client-side
      - run: pnpm run verify
        working-directory: server-side
      - run: pnpm run verify
        working-directory: client-side
